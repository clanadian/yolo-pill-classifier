<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:720pt; height:405pt; overflow:hidden;
    font-family:'Pretendard',sans-serif;
    background:#FFFFFF; color:#111111;
    position:relative; word-break:keep-all;
  }
  .spine { position:absolute; left:0; top:0; width:6pt; height:100%; background:#E8000D; }
  .frame { position:absolute; left:6pt; top:0; right:0; bottom:0; padding:38pt 48pt 30pt; display:flex; flex-direction:column; }
  .eyebrow-row { display:flex; justify-content:space-between; align-items:baseline; }
  .eyebrow { font-size:10pt; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#E8000D; }
  .pageno { font-size:10pt; color:#8A8A8A; font-variant-numeric:tabular-nums; }
  h1 { font-size:28pt; font-weight:700; letter-spacing:-0.01em; margin-top:8pt; }
  .rule { height:1px; background:#DDDDDD; margin:16pt 0 6pt; }
  .list { flex:1; display:flex; flex-direction:column; }
  .row { display:flex; align-items:center; gap:20pt; padding:16pt 0; border-bottom:1px solid #DDDDDD; }
  .row:last-child { border-bottom:none; }
  .num { font-size:20pt; font-weight:700; color:#E8000D; font-variant-numeric:tabular-nums; width:34pt; }
  .row-title { font-size:16pt; font-weight:700; width:120pt; flex-shrink:0; }
  .row-desc { font-size:11.5pt; color:#444444; }
</style>
</head>
<body>
  <div class="spine"></div>
  <div class="frame">
    <div class="eyebrow-row">
      <span class="eyebrow">Contents</span>
      <span class="pageno">02</span>
    </div>
    <h1>목차</h1>
    <div class="rule"></div>
    <div class="list">
      <div class="row">
        <span class="num">01</span>
        <span class="row-title">개요</span>
        <span class="row-desc">프로젝트 목표 · 데이터셋 · 학습 · Jetson 실시간 데모 · 안내 기능 · 기대효과</span>
      </div>
      <div class="row">
        <span class="num">02</span>
        <span class="row-title">트러블슈팅</span>
        <span class="row-desc">자동 라벨링 · 데이터 일관성 · 색보정</span>
      </div>
      <div class="row">
        <span class="num">03</span>
        <span class="row-title">결과</span>
        <span class="row-desc">실제 Jetson Nano 데모 화면</span>
      </div>
      <div class="row">
        <span class="num">04</span>
        <span class="row-title">고찰</span>
        <span class="row-desc">배운 점 · 한계 · 다음 단계</span>
      </div>
    </div>
  </div>
</body>
</html>
