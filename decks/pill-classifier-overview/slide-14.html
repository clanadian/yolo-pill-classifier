<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:720pt; height:405pt; overflow:hidden; font-family:'Pretendard',sans-serif; background:#FFFFFF; color:#111111; position:relative; word-break:keep-all; }
  .spine { position:absolute; left:0; top:0; width:6pt; height:100%; background:#E8000D; }
  .frame { position:absolute; left:6pt; top:0; right:0; bottom:0; padding:26pt 42pt 20pt 36pt; display:flex; flex-direction:column; }
  .eyebrow-row { display:flex; justify-content:space-between; align-items:baseline; }
  .eyebrow { font-size:10pt; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#E8000D; }
  .pageno { font-size:10pt; color:#8A8A8A; font-variant-numeric:tabular-nums; }
  h1 { font-size:20pt; font-weight:700; letter-spacing:-0.01em; line-height:1.25; margin-top:5pt; }
  .rule { height:1px; background:#DDDDDD; margin:10pt 0 12pt; }
  .grid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr); gap:9pt; }
  .cell { position:relative; overflow:hidden; border:1px solid #DDDDDD; background:#0a0d13; }
  .cell img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .tag { position:absolute; top:6pt; left:6pt; font-size:10pt; font-weight:700; letter-spacing:0.04em; padding:2pt 6pt; color:#fff; }
  .tag.good { background:#111111; }
  .tag.caution { background:#E8000D; }
  .cap { position:absolute; left:0; right:0; bottom:0; background:rgba(17,17,17,0.85); padding:5pt 8pt; }
  .cap p { color:#fff; font-size:10pt; font-weight:600; }
</style>
</head>
<body>
  <div class="spine"></div>
  <div class="frame">
    <div class="eyebrow-row">
      <span class="eyebrow">03 · 결과 2</span>
      <span class="pageno">14</span>
    </div>
    <h1>여러 알약 동시 인식 & 조합 규칙 매칭 시 배너 안내</h1>
    <div class="rule"></div>
    <div class="grid">
      <div class="cell"><img src="./assets/all_video-start.png" alt="다중 인식"><div class="cap"><p>다중 인식</p></div></div>
      <div class="cell"><img src="./assets/비타민D_칼슘_video-start.png" alt="좋은 조합"><span class="tag good">GOOD</span><div class="cap"><p>비타민D + 칼슘</p></div></div>
      <div class="cell"><img src="./assets/칼슘_마그네슘_video-start.png" alt="확인 필요 조합"><span class="tag caution">CAUTION</span><div class="cap"><p>칼슘 + 마그네슘</p></div></div>
      <div class="cell"><img src="./assets/비타민D_오메가3_video-start.png" alt="좋은 조합2"><span class="tag good">GOOD</span><div class="cap"><p>비타민D + 오메가3</p></div></div>
    </div>
  </div>
</body>
</html>
