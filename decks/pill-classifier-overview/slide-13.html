<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:720pt; height:405pt; overflow:hidden; font-family:'Pretendard',sans-serif; background:#FFFFFF; color:#111111; position:relative; word-break:keep-all; }
  .spine { position:absolute; left:0; top:0; width:6pt; height:100%; background:#E8000D; }
  .frame { position:absolute; left:6pt; top:0; right:0; bottom:0; padding:26pt 42pt 20pt 36pt; display:flex; flex-direction:column; }
  .eyebrow-row { display:flex; justify-content:space-between; align-items:baseline; }
  .eyebrow { font-size:10pt; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#E8000D; }
  .pageno { font-size:10pt; color:#8A8A8A; font-variant-numeric:tabular-nums; }
  h1 { font-size:20pt; font-weight:700; letter-spacing:-0.01em; line-height:1.25; margin-top:5pt; }
  .rule { height:1px; background:#DDDDDD; margin:10pt 0 12pt; }
  .grid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:9pt; }
  .cell { position:relative; overflow:hidden; border:1px solid #DDDDDD; background:#0a0d13; }
  .cell img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .cap { position:absolute; left:0; right:0; bottom:0; background:rgba(17,17,17,0.85); padding:5pt 8pt; display:flex; justify-content:space-between; align-items:baseline; }
  .cap .sup { color:#fff; font-size:10.5pt; font-weight:700; }
  .cap .cls { color:#bbbbbb; font-size:10pt; font-family:monospace; }
</style>
</head>
<body>
  <div class="spine"></div>
  <div class="frame">
    <div class="eyebrow-row">
      <span class="eyebrow">03 · 결과 1</span>
      <span class="pageno">13</span>
    </div>
    <h1>6개 클래스 모두 실시간으로 정확히 인식, 영양제 이름으로 표시</h1>
    <div class="rule"></div>
    <div class="grid">
      <div class="cell"><img src="./assets/capsule_오메가3_1.png" alt="capsule → 오메가3"><div class="cap"><span class="sup">오메가3</span><span class="cls">capsule</span></div></div>
      <div class="cell"><img src="./assets/green_caplet_마그네슘_1.png" alt="green_caplet → 마그네슘"><div class="cap"><span class="sup">마그네슘</span><span class="cls">green_caplet</span></div></div>
      <div class="cell"><img src="./assets/mint_circle_유산균_1.png" alt="mint_circle → 유산균"><div class="cap"><span class="sup">유산균</span><span class="cls">mint_circle</span></div></div>
      <div class="cell"><img src="./assets/pink_caplet_칼슘.png" alt="pink_caplet → 칼슘"><div class="cap"><span class="sup">칼슘</span><span class="cls">pink_caplet</span></div></div>
      <div class="cell"><img src="./assets/white_caplet_비타민C_1.png" alt="white_caplet → 비타민C"><div class="cap"><span class="sup">비타민C</span><span class="cls">white_caplet</span></div></div>
      <div class="cell"><img src="./assets/yellow_caplet_비타민D_1.png" alt="yellow_caplet → 비타민D"><div class="cap"><span class="sup">비타민D</span><span class="cls">yellow_caplet</span></div></div>
    </div>
  </div>
</body>
</html>
