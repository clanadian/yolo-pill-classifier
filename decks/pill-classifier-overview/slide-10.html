<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:720pt; height:405pt; overflow:hidden; font-family:'Pretendard',sans-serif; background:#FFFFFF; color:#111111; position:relative; word-break:keep-all; }
  .spine { position:absolute; left:0; top:0; width:6pt; height:100%; background:#E8000D; }
  .frame { position:absolute; left:6pt; top:0; right:0; bottom:0; padding:30pt 42pt 20pt 36pt; display:flex; flex-direction:column; }
  .eyebrow-row { display:flex; justify-content:space-between; align-items:baseline; }
  .eyebrow { font-size:10pt; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#E8000D; }
  .pageno { font-size:10pt; color:#8A8A8A; font-variant-numeric:tabular-nums; }
  h1 { font-size:21pt; font-weight:700; letter-spacing:-0.01em; line-height:1.3; margin-top:6pt; }
  .rule { height:1px; background:#DDDDDD; margin:12pt 0 4pt; }
  .content { flex:1; min-height:0; display:flex; gap:22pt; }
  .diag { flex:1.5; display:flex; flex-direction:column; justify-content:center; }
  .diag-row { display:flex; gap:14pt; padding:11pt 0; border-top:1px solid #DDDDDD; }
  .diag-row:first-child { border-top:none; }
  .diag-label { width:56pt; flex-shrink:0; font-size:10pt; font-weight:700; color:#E8000D; text-transform:uppercase; letter-spacing:0.06em; padding-top:2pt; }
  .diag-text { font-size:12pt; color:#444444; line-height:1.6; }
  .diag-text b { color:#111111; }
  .stats { flex:1; border-left:1px solid #DDDDDD; padding-left:22pt; display:flex; flex-direction:column; justify-content:center; gap:20pt; }
  .stat .n { font-size:32pt; font-weight:700; color:#E8000D; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  .stat .l { font-size:10.5pt; color:#444444; margin-top:2pt; line-height:1.4; }
</style>
</head>
<body>
  <div class="spine"></div>
  <div class="frame">
    <div class="eyebrow-row">
      <span class="eyebrow">02 · 트러블슈팅 2</span>
      <span class="pageno">10</span>
    </div>
    <h1>데이터 일관성 문제 — 라벨을 다시 그려도 못 고치는 문제는 과감히 제외</h1>
    <div class="rule"></div>
    <div class="content">
      <div class="diag">
        <div class="diag-row">
          <span class="diag-label">증상</span>
          <p class="diag-text"><b>purple_pill</b>(반투명 캡슐)이 촬영 배경(흰/검)에 따라 완전히 다른 색으로 촬영됨</p>
        </div>
        <div class="diag-row">
          <span class="diag-label">판단</span>
          <p class="diag-text">라벨링 문제가 아니라 <b>촬영 조건 자체의 데이터 일관성 문제</b>로 진단</p>
        </div>
        <div class="diag-row">
          <span class="diag-label">조치</span>
          <p class="diag-text">해당 클래스를 데이터셋에서 <b>통째로 제외</b>. 재도입하려면 배경 조건을 통일한 재촬영 필요</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><p class="n">1개</p><p class="l">데이터 일관성 문제로 제외된 클래스</p></div>
        <div class="stat"><p class="n">6개</p><p class="l">최종 데이터셋에 남은 클래스 수</p></div>
      </div>
    </div>
  </div>
</body>
</html>
