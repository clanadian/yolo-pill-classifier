<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 720pt;
        height: 405pt;
        overflow: hidden;
        font-family: "Pretendard", sans-serif;
        background: #111111;
        color: #ffffff;
        position: relative;
        word-break: keep-all;
      }
      .spine {
        position: absolute;
        left: 0;
        top: 0;
        width: 6pt;
        height: 100%;
        background: #e8000d;
      }
      .frame {
        position: absolute;
        left: 6pt;
        top: 0;
        right: 0;
        bottom: 0;
        padding: 40pt 48pt;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .tag {
        font-size: 10pt;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #e8000d;
      }
      h1 {
        font-size: 44pt;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.3;
        margin-top: 16pt;
      }
      .desc {
        font-size: 13.5pt;
        color: #aaaaaa;
        margin-top: 16pt;
        max-width: 480pt;
        line-height: 1.6;
      }
      .rule {
        height: 1px;
        background: #333333;
        margin-bottom: 14pt;
      }
      .footer-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .footer-row .qa {
        font-size: 20pt;
        font-weight: 700;
      }
      .footer-row .pageno {
        font-size: 10pt;
        color: #777777;
      }
    </style>
  </head>
  <body>
    <div class="spine"></div>
    <div class="frame">
      <div>
        <span class="tag">Closing</span>
        <h1>Thank You</h1>
      </div>
      <div>
        <div class="rule"></div>
        <div class="footer-row">
          <span class="qa">Q&amp;A</span>
          <span class="pageno">18</span>
        </div>
      </div>
    </div>
  </body>
</html>
