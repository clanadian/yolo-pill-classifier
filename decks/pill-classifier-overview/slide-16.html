<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:720pt; height:405pt; overflow:hidden; font-family:'Pretendard',sans-serif; background:#111111; color:#FFFFFF; position:relative; word-break:keep-all; }
  .spine { position:absolute; left:0; top:0; width:6pt; height:100%; background:#E8000D; }
  .frame { position:absolute; left:6pt; top:0; right:0; bottom:0; padding:40pt 48pt; display:flex; flex-direction:column; justify-content:space-between; }
  .top-row { display:flex; justify-content:space-between; align-items:flex-start; }
  .num { font-size:14pt; font-weight:700; color:#E8000D; font-variant-numeric:tabular-nums; }
  .pageno { font-size:10pt; color:#777777; }
  h1 { font-size:52pt; font-weight:700; letter-spacing:-0.02em; line-height:1.25; }
  .subtitle { font-size:14pt; color:#AAAAAA; margin-top:16pt; max-width:460pt; line-height:1.6; }
  .rule { height:1px; background:#333333; margin-top:20pt; }
</style>
</head>
<body>
  <div class="spine"></div>
  <div class="frame">
    <div class="top-row">
      <span class="num">SECTION 04</span>
      <span class="pageno">16</span>
    </div>
    <div>
      <h1>고찰</h1>
      <p class="subtitle">이번 프로젝트에서 배운 것과 남은 한계</p>
    </div>
    <div class="rule"></div>
  </div>
</body>
</html>
