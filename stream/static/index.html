<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pill Detector — Live</title>
  <style>
    :root {
      --bg-0: #0b0e14;
      --bg-1: #12161f;
      --card: #161b26;
      --border: rgba(255, 255, 255, 0.08);
      --text: #eef1f6;
      --text-dim: rgba(238, 241, 246, 0.55);
      --accent: #6ea8ff;
      --good: #34d399;
      --good-bg: rgba(52, 211, 153, 0.14);
      --good-border: rgba(52, 211, 153, 0.45);
      --caution: #f87171;
      --caution-bg: rgba(248, 113, 113, 0.14);
      --caution-border: rgba(248, 113, 113, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(60rem 30rem at 50% -10%, var(--bg-1), transparent),
        var(--bg-0);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem 3rem;
    }

    .page {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand .logo-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #9b7bff);
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #666;
      transition: background 0.3s ease;
    }

    .status.live .status-dot {
      background: var(--good);
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .status.retrying .status-dot {
      background: #f5b84f;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2); }
      50% { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0.06); }
    }

    .frame-card {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.6);
      aspect-ratio: 4 / 3;
    }

    .frame-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .combo-banner {
      position: absolute;
      left: 0.75rem;
      right: 0.75rem;
      bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 0.9rem;
      border-radius: 14px;
      backdrop-filter: blur(10px);
      transform: translateY(130%);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      pointer-events: none;
    }

    .combo-banner.show {
      transform: translateY(0);
      opacity: 1;
    }

    .combo-banner.good {
      background: var(--good-bg);
      border: 1px solid var(--good-border);
      color: #d3fbe9;
    }

    .combo-banner.caution {
      background: var(--caution-bg);
      border: 1px solid var(--caution-border);
      color: #ffe1de;
    }

    .combo-icon {
      font-size: 1.1rem;
      line-height: 1;
    }

    .combo-message {
      font-size: 0.92rem;
      font-weight: 500;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-dim);
      padding: 0 1rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <span class="logo-dot"></span>
        <h1>Pill Detector</h1>
      </div>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="status-text">connecting…</span>
      </div>
    </div>

    <div class="frame-card">
      <img id="stream" alt="live feed" />
      <div class="combo-banner" id="combo-banner">
        <span class="combo-icon" id="combo-icon"></span>
        <span class="combo-message" id="combo-message"></span>
      </div>
    </div>

    <div class="disclaimer">
      ⚠ 참고용 데모입니다 — 실제 복약 판단에 사용하지 마세요.
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
